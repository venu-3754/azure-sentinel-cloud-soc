<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="url(#bg)" />

  <!-- Window Header -->
  <rect width="1200" height="42" fill="#0f172a" />
  <circle cx="24" cy="21" r="6" fill="#ef4444" />
  <circle cx="44" cy="21" r="6" fill="#f59e0b" />
  <circle cx="64" cy="21" r="6" fill="#10b981" />
  <text x="95" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">Azure Log Analytics — KQL Query Editor | Scope: law-sentinel-soc</text>

  <!-- Action Bar -->
  <rect x="0" y="42" width="1200" height="42" fill="#1e293b" />
  <rect x="25" y="49" width="85" height="28" rx="4" fill="#0284c7" />
  <text x="45" y="68" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">▶ Run</text>
  <rect x="120" y="49" width="120" height="28" rx="4" fill="#334155" />
  <text x="135" y="68" font-family="sans-serif" font-size="12" fill="#cbd5e1">Time: Last 24 hours</text>
  <rect x="250" y="49" width="140" height="28" rx="4" fill="#334155" />
  <text x="265" y="68" font-family="sans-serif" font-size="12" fill="#cbd5e1">+ New alert rule</text>
  <text x="1000" y="68" font-family="sans-serif" font-size="12" fill="#10b981">● Query completed (0.42s) | 14 records</text>

  <!-- KQL Query Editor Window -->
  <rect x="25" y="100" width="1150" height="190" rx="8" fill="#030712" stroke="#1f2937" stroke-width="1.5" />
  
  <!-- Line Numbers -->
  <text x="40" y="125" font-family="monospace" font-size="12" fill="#475569">1</text>
  <text x="40" y="145" font-family="monospace" font-size="12" fill="#475569">2</text>
  <text x="40" y="165" font-family="monospace" font-size="12" fill="#475569">3</text>
  <text x="40" y="185" font-family="monospace" font-size="12" fill="#475569">4</text>
  <text x="40" y="205" font-family="monospace" font-size="12" fill="#475569">5</text>
  <text x="40" y="225" font-family="monospace" font-size="12" fill="#475569">6</text>
  <text x="40" y="245" font-family="monospace" font-size="12" fill="#475569">7</text>
  <text x="40" y="265" font-family="monospace" font-size="12" fill="#475569">8</text>

  <!-- KQL Code with Syntax Highlighting -->
  <text x="70" y="125" font-family="monospace" font-size="13">
    <tspan fill="#38bdf8" font-weight="bold">SecurityEvent</tspan>
  </text>
  <text x="70" y="145" font-family="monospace" font-size="13">
    <tspan fill="#94a3b8">| </tspan><tspan fill="#ec4899">where</tspan><tspan fill="#f8fafc"> TimeGenerated >= </tspan><tspan fill="#a855f7">ago</tspan><tspan fill="#f8fafc">(1h)</tspan>
  </text>
  <text x="70" y="165" font-family="monospace" font-size="13">
    <tspan fill="#94a3b8">| </tspan><tspan fill="#ec4899">where</tspan><tspan fill="#f8fafc"> EventID == </tspan><tspan fill="#fbbf24">4625</tspan><tspan fill="#64748b"> // An account failed to log on</tspan>
  </text>
  <text x="70" y="185" font-family="monospace" font-size="13">
    <tspan fill="#94a3b8">| </tspan><tspan fill="#ec4899">where</tspan><tspan fill="#f8fafc"> LogonType </tspan><tspan fill="#ec4899">in</tspan><tspan fill="#f8fafc"> (3, 10) </tspan><tspan fill="#64748b">// 3 = Network (SMB), 10 = RemoteInteractive (RDP)</tspan>
  </text>
  <text x="70" y="205" font-family="monospace" font-size="13">
    <tspan fill="#94a3b8">| </tspan><tspan fill="#ec4899">summarize</tspan><tspan fill="#f8fafc"> FailedAttempts = </tspan><tspan fill="#a855f7">count</tspan><tspan fill="#f8fafc">(), TargetedAccounts = </tspan><tspan fill="#a855f7">make_set</tspan><tspan fill="#f8fafc">(TargetAccount) </tspan><tspan fill="#ec4899">by</tspan><tspan fill="#f8fafc"> IpAddress, Computer, </tspan><tspan fill="#a855f7">bin</tspan><tspan fill="#f8fafc">(TimeGenerated, 5m)</tspan>
  </text>
  <text x="70" y="225" font-family="monospace" font-size="13">
    <tspan fill="#94a3b8">| </tspan><tspan fill="#ec4899">where</tspan><tspan fill="#f8fafc"> FailedAttempts >= </tspan><tspan fill="#fbbf24">5</tspan>
  </text>
  <text x="70" y="245" font-family="monospace" font-size="13">
    <tspan fill="#94a3b8">| </tspan><tspan fill="#ec4899">extend</tspan><tspan fill="#f8fafc"> IPCustomEntity = IpAddress, AccountCustomEntity = </tspan><tspan fill="#38bdf8">tostring</tspan><tspan fill="#f8fafc">(TargetedAccounts[0])</tspan>
  </text>
  <text x="70" y="265" font-family="monospace" font-size="13">
    <tspan fill="#94a3b8">| </tspan><tspan fill="#ec4899">sort by</tspan><tspan fill="#f8fafc"> FailedAttempts </tspan><tspan fill="#ec4899">desc</tspan>
  </text>

  <!-- Query Results Header -->
  <rect x="25" y="305" width="1150" height="35" rx="4" fill="#1e293b" />
  <text x="45" y="328" font-family="sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">TIME (5M BIN)</text>
  <text x="220" y="328" font-family="sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">HOST (Computer)</text>
  <text x="420" y="328" font-family="sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">SOURCE IP (IpAddress)</text>
  <text x="640" y="328" font-family="sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">FAILED COUNT</text>
  <text x="770" y="328" font-family="sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">TARGETED ACCOUNTS</text>
  <text x="1020" y="328" font-family="sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">SEVERITY FLAG</text>

  <!-- Result Row 1 -->
  <rect x="25" y="345" width="1150" height="48" fill="#111827" stroke="#1f2937" stroke-width="0.8" />
  <text x="45" y="375" font-family="monospace" font-size="11" fill="#cbd5e1">2026-10-21 09:10:00</text>
  <text x="220" y="375" font-family="monospace" font-size="11" fill="#38bdf8">vm-target-endpoint</text>
  <text x="420" y="375" font-family="monospace" font-size="11" fill="#ef4444" font-weight="bold">198.51.100.2</text>
  <rect x="640" y="358" width="45" height="22" rx="4" fill="#dc2626" />
  <text x="655" y="374" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">14</text>
  <text x="770" y="375" font-family="monospace" font-size="11" fill="#e2e8f0">["AdminUser", "Administrator", "root"]</text>
  <rect x="1020" y="358" width="90" height="22" rx="4" fill="#7f1d1d" />
  <text x="1035" y="374" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fca5a5">CRITICAL</text>

  <!-- Result Row 2 -->
  <rect x="25" y="398" width="1150" height="48" fill="#1e293b" fill-opacity="0.2" stroke="#1f2937" stroke-width="0.8" />
  <text x="45" y="428" font-family="monospace" font-size="11" fill="#cbd5e1">2026-10-21 08:45:00</text>
  <text x="220" y="428" font-family="monospace" font-size="11" fill="#38bdf8">vm-target-endpoint</text>
  <text x="420" y="428" font-family="monospace" font-size="11" fill="#f59e0b">203.0.113.88</text>
  <rect x="640" y="411" width="45" height="22" rx="4" fill="#d97706" />
  <text x="659" y="427" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">8</text>
  <text x="770" y="428" font-family="monospace" font-size="11" fill="#e2e8f0">["guest", "support", "user1"]</text>
  <rect x="1020" y="411" width="90" height="22" rx="4" fill="#78350f" />
  <text x="1040" y="427" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fcd34d">MEDIUM</text>

  <!-- Result Row 3 -->
  <rect x="25" y="451" width="1150" height="48" fill="#111827" stroke="#1f2937" stroke-width="0.8" />
  <text x="45" y="481" font-family="monospace" font-size="11" fill="#cbd5e1">2026-10-21 07:20:00</text>
  <text x="220" y="481" font-family="monospace" font-size="11" fill="#38bdf8">vm-target-endpoint</text>
  <text x="420" y="481" font-family="monospace" font-size="11" fill="#f59e0b">192.0.2.45</text>
  <rect x="640" y="464" width="45" height="22" rx="4" fill="#d97706" />
  <text x="659" y="480" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">6</text>
  <text x="770" y="481" font-family="monospace" font-size="11" fill="#e2e8f0">["Administrator"]</text>
  <rect x="1020" y="464" width="90" height="22" rx="4" fill="#78350f" />
  <text x="1040" y="480" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fcd34d">MEDIUM</text>

  <!-- Timeline Sparkline Chart -->
  <rect x="25" y="515" width="1150" height="140" rx="8" fill="#0f172a" stroke="#1f2937" stroke-width="1" />
  <text x="45" y="542" font-family="sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">FAILED AUTHENTICATION EVENT DENSITY (24-HOUR SPIKE VISUALIZATION)</text>
  
  <!-- Grid Lines -->
  <line x1="50" y1="570" x2="1140" y2="570" stroke="#1e293b" stroke-width="1" />
  <line x1="50" y1="605" x2="1140" y2="605" stroke="#1e293b" stroke-width="1" />
  <line x1="50" y1="640" x2="1140" y2="640" stroke="#334155" stroke-width="1" />

  <!-- Attack Spike Polyline -->
  <polyline fill="none" stroke="#ef4444" stroke-width="3" points="
    60,635 150,635 250,630 350,635 450,625 550,630 650,635 
    750,610 820,590 850,550 870,555 920,600 1000,630 1120,635
  " />
  <circle cx="850" cy="550" r="5" fill="#ef4444" />
  <rect x="800" y="525" width="110" height="20" rx="3" fill="#dc2626" />
  <text x="812" y="539" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">Attack Spike (09:10)</text>
</svg>
